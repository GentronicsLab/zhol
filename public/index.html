// ============================================================
// Render
// ============================================================

function render() {
  if (drag && drag.moving) { renderLater = true; return; }
  const app = document.getElementById('app');
  const handEl = document.getElementById('hand');
  const handScroll = handEl ? handEl.scrollLeft : 0;
  const zoneScroll = {};
  document.querySelectorAll('.zone').forEach((z) => { zoneScroll[z.className] = z.scrollTop; });
  let html;
  switch (ui.screen) {
    case 'menu': html = menuHTML(); break;
    case 'create': html = createHTML(); break;
    case 'join': html = joinHTML(); break;
    case 'lobby': html = lobbyHTML(); break;
    case 'game': html = gameHTML(); break;
    default: html = homeHTML();
  }
  app.className = ui.screen === 'game' ? 'in-game' : 'in-menu';
  app.innerHTML = html;
  document.querySelectorAll('.zone').forEach((z) => { if (zoneScroll[z.className]) z.scrollTop = zoneScroll[z.className]; });
  const h2 = document.getElementById('hand');
  if (h2) {
    h2.scrollLeft = handScroll;
    if (ui.scrollToNew) {
      ui.scrollToNew = false;
      const fresh = h2.querySelector('.card.new');
      if (fresh) h2.scrollLeft = Math.max(0, fresh.offsetLeft - h2.clientWidth / 2);
    }
    layoutHand(h2);
  }
  ui.lastRects = snapshot();
}

function layoutHand(handEl) {
  const cards = handEl.querySelectorAll('.card');
  const n = cards.length;
  const width = handEl.clientWidth - 16;
  if (n < 2 || width <= 0) return;
  const w = cards[0].offsetWidth || 52;
  const step = Math.max(14, Math.min(w + 4, (width - w) / (n - 1)));
  cards.forEach((c, i) => { c.style.marginLeft = (i === 0 ? 0 : step - w) + 'px'; });
}

// ============================================================
// Dragging cards in your hand
// ============================================================

let drag = null;
let renderLater = false;
let suppressClick = { id: null, until: 0 };
function handCardEls() { return Array.from(document.querySelectorAll('#hand .card[data-card]')); }
function dropIndex(x, id) {
  const els = handCardEls().filter((el) => el.getAttribute('data-card') !== String(id));
  let index = 0;
  for (let i = 0; i < els.length; i++) {
    const r = els[i].getBoundingClientRect();
    const next = i + 1 < els.length ? els[i + 1].getBoundingClientRect().left : r.right;
    const visible = Math.max(8, Math.min(r.width, next - r.left));
    if (x > r.left + visible / 2) index = i + 1;
  }
  return index;
}
function showDropMarker(index, id) {
  const els = handCardEls().filter((el) => el.getAttribute('data-card') !== String(id));
  els.forEach((el) => el.classList.remove('drop-before', 'drop-after'));
  if (els.length === 0) return;
  if (index < els.length) els[index].classList.add('drop-before'); else els[els.length - 1].classList.add('drop-after');
}
function endDrag(drop, x) {
  const d = drag;
  drag = null;
  if (!d) return;
  if (d.ghost) d.ghost.remove();
  if (d.moving) {
    suppressClick = { id: d.id, until: Date.now() + 400 };
    if (drop) moveCard(d.id, dropIndex(x, d.id));
    renderLater = false;
    render();
  }
}

// ============================================================
// Taps and typing
// ============================================================

const app = document.getElementById('app');

app.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('#hand .card[data-card]');
  if (!el || (e.button !== undefined && e.button > 0)) return;
  drag = { id: parseInt(el.getAttribute('data-card'), 10), x0: e.clientX, y0: e.clientY, moving: false, ghost: null, el };
});
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moving) {
    if (Math.abs(dx) + Math.abs(dy) < 8) return;
    drag.moving = true;
    const r = drag.el.getBoundingClientRect();
    const ghost = drag.el.cloneNode(true);
    ghost.classList.add('drag-ghost'); ghost.classList.remove('sel');
    ghost.style.marginLeft = '0px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    drag.offX = drag.x0 - r.left; drag.offY = drag.y0 - r.top;
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.el.classList.add('dragging');
  }
  drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
  showDropMarker(dropIndex(e.clientX, drag.id), drag.id);
  if (e.cancelable) e.preventDefault();
});
window.addEventListener('pointerup', (e) => { if (drag) endDrag(true, e.clientX); });
window.addEventListener('pointercancel', () => { if (drag) endDrag(false, 0); });
window.addEventListener('touchmove', (e) => { if (drag && drag.moving) e.preventDefault(); }, { passive: false });
window.addEventListener('resize', () => { const h = document.getElementById('hand'); if (h) layoutHand(h); });

app.addEventListener('input', (e) => {
  const f = e.target.getAttribute && e.target.getAttribute('data-field');
  if (f === 'name') ui.name = e.target.value;
  if (f === 'code') { ui.code = e.target.value.toUpperCase(); if (e.target.value !== ui.code) e.target.value = ui.code; }
});
app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.getAttribute || !e.target.getAttribute('data-field')) return;
  if (ui.screen === 'create') createGame();
  if (ui.screen === 'join') joinGame();
});

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const index = el.getAttribute('data-index') !== null ? parseInt(el.getAttribute('data-index'), 10) : -1;
  switch (el.getAttribute('data-action')) {
    // start window
    case 'home': ui.screen = 'home'; ui.formError = ''; render(); break;
    case 'menu': ui.screen = 'menu'; ui.formError = ''; render(); break;
    case 'toCreate': ui.screen = 'create'; ui.formError = ''; render(); break;
    case 'toJoin': ui.screen = 'join'; ui.formError = ''; render(); break;
    case 'solo': startSolo(); break;
    case 'create': createGame(); break;
    case 'join': joinGame(); break;
    case 'share': shareLink(); break;
    case 'startOnline': startOnline(); break;
    case 'leaveLobby': leaveLobby(); break;
    case 'goHome': goHome(); break;
    // the table
    case 'toggle': {
      const id = parseInt(el.getAttribute('data-card'), 10);
      if (suppressClick.id === id && Date.now() < suppressClick.until) break;
      toggleCard(id); break;
    }
    case 'draw': perform({ type: 'drawFromPile' }); break;
    case 'takeDiscard': perform({ type: 'takeDiscard' }); break;
    case 'takeBottom': perform({ type: 'takeBottomCard' }); break;
    case 'beginOpen': ui.openingWithDiscard = true; ui.selected = new Set(); ui.staged = []; ui.message = ''; render(); break;
    case 'cancelOpen': ui.openingWithDiscard = false; ui.selected = new Set(); ui.staged = []; ui.message = ''; render(); break;
    case 'auto': autoMeld(); break;
    case 'makeMeld': makeMeld(); break;
    case 'unstage': ui.staged.splice(index, 1); render(); break;
    case 'layDown': layDownAction(); break;
    case 'throw': throwSelected(); break;
    case 'meld': tapMeld(index); break;
    case 'choose': { const o = ui.chooser && ui.chooser.options[parseInt(el.getAttribute('data-option'), 10)]; ui.chooser = null; if (o) perform(o.move); else render(); break; }
    case 'closeChooser': ui.chooser = null; render(); break;
    case 'sortSuit': sortHand('suit'); break;
    case 'sortRank': sortHand('rank'); break;
    case 'nextRound': A().nextRound(); break;
    case 'takeover': online.takeover(index, el.getAttribute('data-on') === '1'); break;
    case 'help': ui.showHelp = true; render(); break;
    case 'closeHelp': ui.showHelp = false; render(); break;
    default: break;
  }
});

// ============================================================
// Start: a shared link (?kod=ABCD) opens the join screen; a saved game is reopened
// ============================================================

window.__zhol = ui;
window.__zholOnline = online;
window.__zholSolo = solo;

(function boot() {
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
  const linkCode = params && params.get('kod');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('zhol.session') || 'null'); } catch (e) { saved = null; }
  if (saved && saved.code && saved.token && (!linkCode || linkCode.toUpperCase() === saved.code)) {
    ui.mode = 'online'; ui.screen = 'lobby';
    online.connect(saved);
  } else if (linkCode) {
    ui.code = linkCode.toUpperCase().slice(0, 4);
    ui.screen = 'join';
  }
  render();
})();
})();

</script>
</body>
