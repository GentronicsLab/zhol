  return html + '</div>';
}

// ---------- the table ----------

function cardHTML(card, w, opts) {
  opts = opts || {};
  const cls = ['card'];
  if (Z.isJoker(card)) cls.push('joker'); else cls.push(card.suit === 'hearts' || card.suit === 'diamonds' ? 'red' : 'black');
  if (opts.selected) cls.push('sel');
  if (opts.highlight) cls.push('hi');
  if (opts.isNew) cls.push('new');
  if (opts.landing) cls.push('landing');
  if (w < 34) cls.push('small');
  let inner;
  if (Z.isJoker(card)) {
    inner = '<span class="jk-star">★</span>' + (w < 34 ? (opts.stands ? '<span class="jk-stand">' + opts.stands + '</span>' : '') : '<span class="jk-text">' + t('jokerText') + '</span>');
  } else {
    const s = SUIT_SYMBOL[card.suit] + TEXT_STYLE;
    inner = w < 34
      ? '<span class="r">' + rankText(card.rank) + '</span><span class="s">' + s + '</span>'
      : '<span class="big-suit">' + s + '</span><span class="idx">' + rankText(card.rank) + '<br>' + s + '</span>';
  }
  if (opts.isNew) inner += '<span class="new-tag">' + t('newTag') + '</span>';
  let attrs = opts.tap ? ' data-action="toggle" data-card="' + card.id + '"' : '';
  if (opts.ref) attrs += ' data-ref="' + card.id + '"';
  return '<div class="' + cls.join(' ') + '" style="--w:' + w + 'px"' + attrs + '>' + inner + '</div>';
}
function backHTML(w, count) {
  return '<div class="card back" style="--w:' + w + 'px">' + (count === undefined ? '' : '<span class="count">' + count + '</span>') + '</div>';
}
function emptySlotHTML(w) { return '<div class="card empty" style="--w:' + w + 'px"></div>'; }

function headerHTML() {
  const roundNo = Math.min(A().roundsPlayed() + 1, Z.TOTAL_ROUNDS);
  return '<div class="header"><b class="title">Zhol</b><span>' + t('roundOf', roundNo, Z.TOTAL_ROUNDS) + '</span>' +
    (ui.mode === 'online' ? '<span class="small-text">' + t('codeLabel', esc(online.session.code)) + '</span>' + chatButtonHTML() : '') +
    '<button class="help-btn" data-action="help" aria-label="?">?</button></div>';
}

function meldHTML(meld, index) {
  const options = meldActions(meld, index);
  const glow = options.some((o) => o.kind === 'joker') ? ' can-joker' : options.length ? ' can-sell' : '';
  // a meld that just got new cards glows for a moment (the glow keeps going smoothly through redraws)
  let fresh = '', freshStyle = '';
  const since = ui.fresh[index] !== undefined ? Date.now() - ui.fresh[index] : null;
  if (since !== null && since < FRESH_MS) { fresh = ' fresh'; freshStyle = ' style="animation-delay:' + (-since) + 'ms"'; }
  let html = '<div class="meld' + glow + fresh + '"' + freshStyle + ' data-action="meld" data-index="' + index + '">';
  meld.cards.forEach((card, pos) => {
    let stands = null;
    if (Z.isJoker(card) && meld.kind === 'run' && pos < meld.positions.length) { const place = meld.positions[pos]; stands = rankText(place === 14 ? 1 : place); }
    html += cardHTML(card, CARD_MELD, { stands, ref: true, landing: !!ui.landing['ref:' + card.id] });
  });
  return html + '</div>';
}

function plateHTML(seat) {
  const r = round(), p = r.players[seat];
  const info = A().seatInfo(seat);
  const turn = r.phase !== 'finished' && r.current === seat;
  let badges = '';
  if (A().dealer() === seat) badges += '<span class="badge">' + t('dealer') + '</span>';
  if (p.hasOpened) badges += '<span class="badge open">' + t('opened') + '</span>';
  if (ui.mode === 'online' && seat !== mySeat()) {
    if (info.isBot) badges += '<span class="badge">' + t('computer') + '</span>';
    else if (info.botPlaying) badges += '<span class="badge off">' + t('computerPlays') + '</span>';
    else if (!info.connected) badges += '<span class="badge off">' + t('offlineBadge') + '</span>';
  }
  let fan = '';
  if (seat !== mySeat()) {
    fan = '<div class="fan">';
    for (let k = 0; k < Math.min(p.hand.length, 7); k++) fan += '<div class="mini-back"></div>';
    fan += '<span class="fan-count">' + p.hand.length + '</span></div>';
  }
  let takeover = '';
  if (ui.mode === 'online' && online.isHost() && seat !== mySeat() && !info.isBot && (!info.connected || info.botPlaying)) {
    takeover = info.botPlaying ? '<button class="mini" data-action="takeover" data-index="' + seat + '" data-on="0">' + t('letPlayerPlay') + '</button>'
                               : '<button class="mini" data-action="takeover" data-index="' + seat + '" data-on="1">' + t('letComputerPlay') + '</button>';
  }
  return '<div class="plate' + (turn ? ' turn' : '') + '" id="seat-' + seat + '"><div class="plate-name"><b>' + esc(A().names()[seat]) + '</b>' + badges + '</div>' +
    fan + '<div class="plate-score">' + t('points', A().totals()[seat]) + '</div>' + takeover + '</div>';
}

function zoneHTML(seat) {
  const melds = [];
  round().table.forEach((m, i) => { if (m.owner === seat) melds.push(meldHTML(m, i)); });
  return '<div class="zone zone-' + areaOf(seat) + '">' + plateHTML(seat) + '<div class="zone-melds">' + melds.join('') + '</div></div>';
}

function centerHTML() {
  const r = round(), top = topDiscard();
  let deck = '<div class="deck" id="deck">';
  if (r.bottomCard) deck += '<div class="bottom-card" id="bottom-card">' + cardHTML(r.bottomCard, CARD_BOTTOM) + '</div>';
  deck += r.drawPile.length ? '<div class="deck-stack">' + backHTML(CARD_PILE, r.drawPile.length) + '</div>' : emptySlotHTML(CARD_PILE);
  deck += '</div>';
  return '<div class="center"><div class="center-piles">' + deck +
    '<div class="thrown" id="discard">' + (top ? cardHTML(top, CARD_PILE, { landing: !!ui.landing.discard }) : emptySlotHTML(CARD_PILE)) + '</div></div>' +
    '<div class="center-labels"><span>' + t('deck') + '</span><span>' + t('thrown') + '</span></div>' +
    (r.bottomCard ? '<div class="center-note">' + t('underDeck', cardText(r.bottomCard)) + '</div>' : '') + '</div>';
}

function tableHTML() {
  return '<div class="table seats-' + seatCount() + '" id="table">' + round().players.map((_, s) => zoneHTML(s)).join('') + centerHTML() + '</div>';
}

function statusHTML() {
  let html = '<div class="status"><b>' + hint() + '</b>';
  if (ui.message) html += '<b class="warn">' + ui.message + '</b>';
  else if (ui.lastAction) html += '<span class="muted">' + ui.lastAction + '</span>';
  if (ui.mode === 'online' && !online.connected) html += '<b class="warn">' + t('reconnecting') + '</b>';
  return html + '</div>';
}

function stagedHTML() {
  if (ui.staged.length === 0) return '';
  let html = '<div class="staged">';
  ui.staged.forEach((group, i) => {
    html += '<div class="staged-row"><div class="meld">' + group.map((c) => cardHTML(c, CARD_STAGED, { ref: true })).join('') + '</div><b>' + meldPoints(group) +
      '</b><button class="mini" data-action="unstage" data-index="' + i + '">✕</button></div>';
  });
  html += '<b class="warn">' + (me().hasOpened ? t('meldPointsOpened', stagedPoints()) : t('meldPointsNeed', stagedPoints(), Z.OPENING_MINIMUM)) + '</b></div>';
  return html;
}

function actionsHTML() {
  if (!isMyTurn()) return '';
  const r = round();
  let html = '<div class="actions">';
  if (r.phase === 'draw') {
    if (ui.openingWithDiscard) {
      html += btn(t('findMelds'), 'auto', 'green') + btn(t('makeMeld'), 'makeMeld', 'yellow', selectedCards().length < 3) +
              btn(t('open'), 'layDown', 'orange', !canLayDown() || ui.busy) + btn(t('cancel'), 'cancelOpen', 'gray');
    } else {
      html += btn(t('drawDeck'), 'draw', 'yellow', ui.busy);
      const top = topDiscard();
      if (top) {
        html += me().hasOpened ? btn(t('take', cardText(top)), 'takeDiscard', 'orange', ui.busy)
                               : btn(t('openWith', cardText(top)), 'beginOpen', 'orange', !ui.canOpenWithDiscard);
      }
      if (!me().hasOpened && r.bottomCard) html += btn(t('bottomBtn'), 'takeBottom', 'green', !ui.canTakeBottom || ui.busy);
    }
  } else {
    if (r.phase === 'play') {
      html += btn(t('findMelds'), 'auto', 'green') + btn(t('makeMeld'), 'makeMeld', 'yellow', selectedCards().length < 3) +
              btn(me().hasOpened ? t('layDown') : t('open'), 'layDown', 'orange', !canLayDown() || ui.busy);
    }
    html += btn(t('throwCard'), 'throw', 'red', selectedCards().length !== 1 || ui.busy);
  }
  return html + '</div>';
}

function handHTML() {
  const cards = availableHand();
  let html = '<div class="hand-box"><div class="hand-head"><span>' + t('yourCards', cards.length) + '</span>' +
    '<span class="drag-tip">' + t('dragTip') + '</span><span><button class="link" data-action="sortSuit">' + t('bySuit') + '</button>' +
    '<button class="link" data-action="sortRank">' + t('byRank') + '</button></span></div><div class="hand" id="hand">';
  cards.forEach((card) => {
    html += cardHTML(card, CARD_HAND, {
      selected: ui.selected.has(card.id),
      highlight: ui.openingWithDiscard && topDiscard() && card.id === topDiscard().id,
      isNew: card.id === ui.newCardId,
      landing: !!ui.landing['card:' + card.id],
      tap: true,
    });
  });
  return html + '</div></div>';
}

function closeText(result) {
  const f = (STR[ui.lang] || STR.sq).close[result.closeType];
  return f ? f(result.closer === mySeat(), esc(A().names()[result.closer])) : '';
}

function resultHTML() {
  const r = round();
  if (r.phase !== 'finished' || !r.result) return '';
  const result = r.result;
  const played = A().roundsPlayed();
  const over = played + 1 >= Z.TOTAL_ROUNDS;
  const totals = A().totals().map((tt, s) => tt + result.scores[s]);
  const names = A().names();
  let winner = '';
  if (over) {
    const lowest = Math.min.apply(null, totals);
    const leaders = totals.map((tt, i) => (tt === lowest ? i : -1)).filter((i) => i >= 0);
    const me0 = mySeat();
    winner = leaders.length === 1 && leaders[0] === me0 ? t('youWin')
      : leaders.includes(me0) ? t('tieWith', leaders.filter((i) => i !== me0).map((i) => esc(names[i])).join(t('and')))
      : t('winners', leaders.map((i) => esc(names[i])).join(t('and')), leaders.length > 1);
  }
  let html = '<div class="overlay"><div class="dialog"><h2>' + (over ? t('gameOver') : t('roundOver', played + 1)) + '</h2>';
  html += over ? '<p class="big">' + winner + '</p><p>' + closeText(result) + '</p>' : '<p>' + closeText(result) + '</p>';
  html += '<table><tr><th></th><th>' + t('colRound') + '</th><th>' + t('colTotal') + '</th></tr>';
  for (let s = 0; s < names.length; s++) html += '<tr><td>' + esc(names[s]) + '</td><td>' + result.scores[s] + '</td><td>' + totals[s] + '</td></tr>';
  html += '</table><p class="muted">' + t('lowestWins') + '</p>';
  if (A().isHost()) html += btn(over ? t('newGame') : t('nextRound'), 'nextRound', 'yellow');
  else html += '<p class="waiting">' + t('waitHostNext', esc(online.hostName())) + '</p>';
  if (over) html += '<div style="height:8px"></div>' + btn(t('toStart'), 'goHome', 'gray');
  return html + '</div></div>';
}

function chooserHTML() {
  if (!ui.chooser) return '';
  let html = '<div class="overlay"><div class="dialog"><h2>' + t('chooseTitle') + '</h2><div class="choices">';
  ui.chooser.options.forEach((o, i) => { html += btn(o.label, 'choose', o.kind === 'joker' ? 'green' : 'orange', false, ' data-option="' + i + '"'); });
  return html + btn(t('cancel'), 'closeChooser', 'gray') + '</div></div></div>';
}

/** Two small buttons to choose the language. */
function langSwitchHTML() {
  return '<div class="lang-switch" role="group" aria-label="' + t('language') + '">' +
    '<button class="lang' + (ui.lang === 'sq' ? ' on' : '') + '" data-action="lang" data-lang="sq">Shqip</button>' +
    '<button class="lang' + (ui.lang === 'en' ? ' on' : '') + '" data-action="lang" data-lang="en">English</button></div>';
}

function helpHTML() {
  if (!ui.showHelp) return '';
  return '<div class="overlay"><div class="dialog"><h2>' + t('helpTitle') + '</h2>' + langSwitchHTML() + '<ul class="help">' +
    t('helpItems').map((item) => '<li>' + item + '</li>').join('') + '</ul>' +
    btn(t('rules'), 'rules', 'orange') + '<div style="height:10px"></div>' +
    btn(t('close2'), 'closeHelp', 'yellow') + '<div style="height:10px"></div>' + btn(t('leaveGame'), 'goHome', 'gray') + '</div></div>';
}

/** The full rules of Zhol, from the start window or from the game. */
function rulesHTML() {
  if (!ui.showRules) return '';
  return '<div class="overlay rules-overlay"><div class="dialog rules"><h2>' + t('rules') + '</h2>' + langSwitchHTML() +
    '<div class="rules-text">' + t('rulesHTML') + '</div>' + btn(t('close2'), 'closeRules', 'yellow') + '</div></div>';
}

function gameHTML() {
  if (!round()) return '<div class="screen"><h1>' + t('connecting') + '</h1></div>';
  return headerHTML() + tableHTML() + statusHTML() + stagedHTML() + actionsHTML() + handHTML() + resultHTML() + chooserHTML() + helpHTML();
}

// ============================================================
// Render
// ============================================================

function render() {
  if (drag && drag.moving) { renderLater = true; return; }
  const app = document.getElementById('app');
  const handEl = document.getElementById('hand');
  const handScroll = handEl ? handEl.scrollLeft : 0;
  const zoneScroll = {};
  document.querySelectorAll('.zone').forEach((z) => { zoneScroll[z.className] = z.scrollTop; });
  let html;
  switch (ui.screen) {
    case 'menu': html = menuHTML(); break;
    case 'create': html = createHTML(); break;
    case 'join': html = joinHTML(); break;
    case 'lobby': html = lobbyHTML(); break;
    case 'game': html = gameHTML(); break;
    default: html = homeHTML();
  }
  app.className = ui.screen === 'game' ? 'in-game' : 'in-menu';
  app.innerHTML = html + rulesHTML();
  document.querySelectorAll('.zone').forEach((z) => { if (zoneScroll[z.className]) z.scrollTop = zoneScroll[z.className]; });
  const h2 = document.getElementById('hand');
  if (h2) {
    h2.scrollLeft = handScroll;
    if (ui.scrollToNew) {
      ui.scrollToNew = false;
      const fresh = h2.querySelector('.card.new');
      if (fresh) h2.scrollLeft = Math.max(0, fresh.offsetLeft - h2.clientWidth / 2);
    }
    layoutHand(h2);
  }
  ui.lastRects = snapshot();
}

function layoutHand(handEl) {
  const cards = handEl.querySelectorAll('.card');
  const n = cards.length;
  const width = handEl.clientWidth - 16;
  if (n < 2 || width <= 0) return;
  const w = cards[0].offsetWidth || 60;
  const step = Math.max(14, Math.min(w + 4, (width - w) / (n - 1)));
  cards.forEach((c, i) => { c.style.marginLeft = (i === 0 ? 0 : step - w) + 'px'; });
}

// ============================================================
// Dragging cards in your hand
// ============================================================

let drag = null;
let renderLater = false;
let suppressClick = { id: null, until: 0 };
function handCardEls() { return Array.from(document.querySelectorAll('#hand .card[data-card]')); }
function dropIndex(x, id) {
  const els = handCardEls().filter((el) => el.getAttribute('data-card') !== String(id));
  let index = 0;
  for (let i = 0; i < els.length; i++) {
    const r = els[i].getBoundingClientRect();
    const next = i + 1 < els.length ? els[i + 1].getBoundingClientRect().left : r.right;
    const visible = Math.max(8, Math.min(r.width, next - r.left));
    if (x > r.left + visible / 2) index = i + 1;
  }
  return index;
}
function showDropMarker(index, id) {
  const els = handCardEls().filter((el) => el.getAttribute('data-card') !== String(id));
  els.forEach((el) => el.classList.remove('drop-before', 'drop-after'));
  if (els.length === 0) return;
  if (index < els.length) els[index].classList.add('drop-before'); else els[els.length - 1].classList.add('drop-after');
}
function endDrag(drop, x) {
  const d = drag;
  drag = null;
  if (!d) return;
  const ghostRect = d.ghost ? d.ghost.getBoundingClientRect() : null;
  if (d.ghost) d.ghost.remove();
  if (d.moving) {
    suppressClick = { id: d.id, until: Date.now() + 400 };
    const oldRects = {};
    handCardEls().forEach((el) => { oldRects[el.getAttribute('data-card')] = el.getBoundingClientRect(); });
    if (drop) moveCard(d.id, dropIndex(x, d.id));
    renderLater = false;
    render();
    slideHand(oldRects, d.id, drop ? ghostRect : null);
  }
}

// ============================================================
// Taps and typing
// ============================================================

const app = document.getElementById('app');

app.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('#hand .card[data-card]');
  if (!el || (e.button !== undefined && e.button > 0)) return;
  drag = { id: parseInt(el.getAttribute('data-card'), 10), x0: e.clientX, y0: e.clientY, moving: false, ghost: null, el };
});
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moving) {
    if (Math.abs(dx) + Math.abs(dy) < 8) return;
    drag.moving = true;
    const r = drag.el.getBoundingClientRect();
    const ghost = drag.el.cloneNode(true);
    ghost.classList.add('drag-ghost'); ghost.classList.remove('sel');
    ghost.style.marginLeft = '0px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    drag.offX = drag.x0 - r.left; drag.offY = drag.y0 - r.top;
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.el.classList.add('dragging');
  }
  drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
  showDropMarker(dropIndex(e.clientX, drag.id), drag.id);
  if (e.cancelable) e.preventDefault();
});
window.addEventListener('pointerup', (e) => { if (drag) endDrag(true, e.clientX); });
window.addEventListener('pointercancel', () => { if (drag) endDrag(false, 0); });
window.addEventListener('touchmove', (e) => { if (drag && drag.moving) e.preventDefault(); }, { passive: false });
window.addEventListener('resize', () => { const h = document.getElementById('hand'); if (h) layoutHand(h); });

app.addEventListener('input', (e) => {
  const f = e.target.getAttribute && e.target.getAttribute('data-field');
  if (f === 'name') ui.name = e.target.value;
  if (f === 'code') { ui.code = e.target.value.toUpperCase(); if (e.target.value !== ui.code) e.target.value = ui.code; }
});
app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.getAttribute || !e.target.getAttribute('data-field')) return;
  if (ui.screen === 'create') createGame();
  if (ui.screen === 'join') joinGame();
});

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const index = el.getAttribute('data-index') !== null ? parseInt(el.getAttribute('data-index'), 10) : -1;
  switch (el.getAttribute('data-action')) {
    // start window
    case 'home': ui.screen = 'home'; ui.formError = ''; render(); break;
    case 'menu': ui.screen = 'menu'; ui.formError = ''; render(); break;
    case 'toCreate': ui.screen = 'create'; ui.formError = ''; render(); break;
    case 'toJoin': ui.screen = 'join'; ui.formError = ''; render(); break;
    case 'solo': startSolo(); break;
    case 'create': createGame(); break;
    case 'join': joinGame(); break;
    case 'share': shareLink(); break;
    case 'startOnline': startOnline(); break;
    case 'leaveLobby': leaveLobby(); break;
    case 'goHome': goHome(); break;
    // the table
    case 'toggle': {
      const id = parseInt(el.getAttribute('data-card'), 10);
      if (suppressClick.id === id && Date.now() < suppressClick.until) break;
      toggleCard(id); break;
    }
    case 'draw': perform({ type: 'drawFromPile' }); break;
    case 'takeDiscard': perform({ type: 'takeDiscard' }); break;
    case 'takeBottom': perform({ type: 'takeBottomCard' }); break;
    case 'beginOpen': ui.openingWithDiscard = true; ui.selected = new Set(); ui.staged = []; ui.message = ''; render(); break;
    case 'cancelOpen': ui.openingWithDiscard = false; ui.selected = new Set(); ui.staged = []; ui.message = ''; render(); break;
    case 'auto': autoMeld(); break;
    case 'makeMeld': makeMeld(); break;
    case 'unstage': ui.staged.splice(index, 1); render(); break;
    case 'layDown': layDownAction(); break;
    case 'throw': throwSelected(); break;
    case 'meld': tapMeld(index); break;
    case 'choose': { const o = ui.chooser && ui.chooser.options[parseInt(el.getAttribute('data-option'), 10)]; ui.chooser = null; if (o) perform(o.move); else render(); break; }
    case 'closeChooser': ui.chooser = null; render(); break;
    case 'sortSuit': sortHand('suit'); break;
    case 'sortRank': sortHand('rank'); break;
    case 'nextRound': A().nextRound(); break;
    case 'takeover': online.takeover(index, el.getAttribute('data-on') === '1'); break;
    case 'chat': openChat(); break;
    case 'lang': setLanguage(el.getAttribute('data-lang')); break;
    case 'rules': ui.showRules = true; render(); break;
    case 'closeRules': ui.showRules = false; render(); break;
    case 'help': ui.showHelp = true; render(); break;
    case 'closeHelp': ui.showHelp = false; render(); break;
    default: break;
  }
});


// ============================================================
// Chat (only when playing with friends)
// ============================================================

const chat = { messages: [], lastId: 0, open: false, unread: 0, toastTimer: null, sending: false, synced: false };

function chatButtonHTML() {
  return '<button class="chat-btn" data-action="chat" aria-label="' + t('chat') + '">💬' + (chat.unread > 0 ? '<span class="unread">' + chat.unread + '</span>' : '') + '</button>';
}

function buildChatUI() {
  const old = document.getElementById('chat-panel');
  const keep = old ? document.getElementById('chat-input').value : '';
  if (old) old.remove();
  const oldToast = document.getElementById('chat-toast');
  if (oldToast) oldToast.remove();

  const panel = document.createElement('div');
  panel.id = 'chat-panel';
  panel.className = 'chat-panel' + (chat.open ? '' : ' hidden');
  panel.innerHTML = '<div class="chat-head"><b>' + t('chat') + '</b><button class="chat-close" id="chat-close">' + t('close2') + '</button></div>' +
    '<div class="chat-list" id="chat-list"></div>' +
    '<div class="chat-quick" id="chat-quick">' + t('quick').map((m) => '<button data-quick="' + esc(m) + '">' + esc(m) + '</button>').join('') + '</div>' +
    '<form class="chat-form" id="chat-form"><input id="chat-input" maxlength="200" autocomplete="off" placeholder="' + t('chatPlaceholder') + '"><button type="submit">' + t('send') + '</button></form>' +
    '<div class="chat-error" id="chat-error"></div>';
  document.body.appendChild(panel);
  document.getElementById('chat-input').value = keep;
  const toast = document.createElement('div');
  toast.id = 'chat-toast';
  toast.className = 'chat-toast hidden';
  document.body.appendChild(toast);

  document.getElementById('chat-close').addEventListener('click', closeChat);
  toast.addEventListener('click', openChat);
  document.getElementById('chat-quick').addEventListener('click', (e) => {
    const b = e.target.closest('[data-quick]');
    if (b) sendChat(b.getAttribute('data-quick'));
  });
  document.getElementById('chat-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    sendChat(input.value).then((ok) => { if (ok) input.value = ''; });
  });
  renderChatList();
}

function renderChatList() {
  const list = document.getElementById('chat-list');
  if (!list) return;
  if (chat.messages.length === 0) { list.innerHTML = '<p class="muted chat-empty">' + t('chatEmpty') + '</p>'; return; }
  const myId = online.state && online.state.you.id;
  list.innerHTML = chat.messages.map((m) => {
    const mine = m.playerId === myId;
    return '<div class="msg' + (mine ? ' mine' : '') + '"><span class="who">' + (mine ? t('you') : esc(m.name)) + '</span><span class="txt">' + esc(m.text) + '</span></div>';
  }).join('');
  list.scrollTop = list.scrollHeight;
}

function onChatFromServer(list, myId) {
  if (!chat.synced) {                                 // the first update after (re)connecting: old messages are not "new"
    chat.synced = true;
    chat.messages = list.slice(-50);
    chat.lastId = list.length ? list[list.length - 1].id : 0;
    renderChatList();
    return;
  }
  const fresh = list.filter((m) => m.id > chat.lastId);
  if (fresh.length === 0) return;
  chat.messages = list.slice(-50);
  chat.lastId = list[list.length - 1].id;
  const fromOthers = fresh.filter((m) => m.playerId !== myId);
  if (!chat.open && fromOthers.length > 0) {
    chat.unread += fromOthers.length;
    showToast(fromOthers[fromOthers.length - 1]);
  }
  renderChatList();
}

function showToast(m) {
  const toast = document.getElementById('chat-toast');
  if (!toast) return;
  toast.innerHTML = '<b>' + esc(m.name) + ':</b> ' + esc(m.text);
  toast.classList.remove('hidden');
  clearTimeout(chat.toastTimer);
  chat.toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
}

function openChat() {
  if (ui.mode !== 'online') return;
  chat.open = true;
  chat.unread = 0;
  document.getElementById('chat-panel').classList.remove('hidden');
  document.getElementById('chat-toast').classList.add('hidden');
  document.getElementById('chat-error').textContent = '';
  renderChatList();
  render();
}

function closeChat() {
  chat.open = false;
  document.getElementById('chat-panel').classList.add('hidden');
  render();
}

function resetChat() {
  chat.messages = []; chat.lastId = 0; chat.unread = 0; chat.open = false; chat.synced = false;
  const panel = document.getElementById('chat-panel');
  if (panel) panel.classList.add('hidden');
  const toast = document.getElementById('chat-toast');
  if (toast) toast.classList.add('hidden');
  renderChatList();
}

async function sendChat(text) {
  text = String(text || '').trim();
  const err = document.getElementById('chat-error');
  if (!text || !online.session || chat.sending) return false;
  chat.sending = true;
  try {
    await online.api('/api/chat', { code: online.session.code, token: online.session.token, text });
    err.textContent = '';
    return true;
  } catch (e) {
    err.textContent = errText(e.code, 'network');
    return false;
  } finally { chat.sending = false; }
}

// ============================================================
// Start: a shared link (?kod=ABCD) opens the join screen; a saved game is reopened
// ============================================================

window.__zhol = ui;
window.__zholOnline = online;
window.__zholSolo = solo;
window.__zholChat = chat;

function setLanguage(lang) {
  if (lang !== 'sq' && lang !== 'en') return;
  ui.lang = lang;
  saveLocal('zhol.lang', lang);
  try { document.documentElement.lang = lang; } catch (e) { /* ignore */ }
  buildChatUI();
  render();
}

(function boot() {
  try { document.documentElement.lang = ui.lang; } catch (e) { /* ignore */ }
  const brand = document.createElement('div');
  brand.id = 'brand';
  brand.textContent = 'Powered by Gentronics Lab';
  document.body.appendChild(brand);
  buildChatUI();
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
  const linkCode = params && params.get('kod');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('zhol.session') || 'null'); } catch (e) { saved = null; }
  if (saved && saved.code && saved.token && (!linkCode || linkCode.toUpperCase() === saved.code)) {
    ui.mode = 'online'; ui.screen = 'lobby';
    online.connect(saved);
  } else if (linkCode) {
    ui.code = linkCode.toUpperCase().slice(0, 4);
    ui.screen = 'join';
  }
  render();
})();
})();

</script>
