.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; z-index: 10; }
.dialog { background: var(--dialog); border-radius: 16px; padding: 20px; max-width: 360px; width: 100%; text-align: center; max-height: 100%; overflow-y: auto; box-sizing: border-box; }

#app.in-menu { justify-content: center; }
.screen { display: flex; flex-direction: column; gap: 10px; align-items: stretch; max-width: 380px; width: 100%; margin: 0 auto; text-align: center; overflow-y: auto; padding: 8px 4px; box-sizing: border-box; max-height: 100%; }

.home .logo { font-size: 68px; font-weight: 800; letter-spacing: 2px; color: var(--yellow); text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }

.field { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 2px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.25); color: var(--text); -webkit-user-select: text; user-select: text; }

<script>
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Zhol = factory();
}(typeof self !== 'undefined' ? self : this, function () {
'use strict';

// ============================================================
// Zhol rules engine. Seats 0..3 go to the right (the direction of play).
// Cards: { id, rank, suit }. rank 1 = ace ... 13 = king. A joker has rank null and suit null.
// ============================================================

const SUITS = ['hearts', 'diamonds', 'clubs', 'spades'];
const OPENING_MINIMUM = 51;
const TOTAL_ROUNDS = 8;

let random = Math.random;
function setRandom(fn) { random = fn || Math.random; }

const isJoker = (c) => c.rank === null;

function handPoints(c) {
  if (c.rank === null) return 25;
  return (c.rank === 1 || c.rank >= 10) ? 10 : c.rank;
}

function shuffle(arr, rng) {
  const r = rng || random;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

// ---------- Deck and deal ----------

function makeFullDeck() {
  const cards = [];
  let id = 0;
  for (let d = 0; d < 2; d++)
    for (const suit of SUITS)
      for (let rank = 1; rank <= 13; rank++) cards.push({ id: id++, rank, suit });
  for (let j = 0; j < 4; j++) cards.push({ id: id++, rank: null, suit: null });
  return cards;
}

/** Shuffle, cut, deal for 2, 3 or 4 players. First player (right of the dealer) gets 15 cards, the others 14.
 *  With 4 players 51 cards stay in the pile (65 with 3, 79 with 2). */
function dealRound(dealer, rng, playerCount) {
  const r = rng || random;
  const n = playerCount || 4;
  const deck = shuffle(makeFullDeck(), r);
  const first = (dealer + 1) % n;
  const cutter = (dealer + n - 1) % n;      // the player to the dealer's left

  const cutIndex = 40 + Math.floor(r() * 29);          // roughly half
  const cutCard = deck.splice(cutIndex - 1, 1)[0];
  const hands = Array.from({ length: n }, () => []);
  let faceUp = null;
  if (isJoker(cutCard)) hands[cutter].push(cutCard); else faceUp = cutCard;

  for (let step = 0; step < n; step++) {
    const seat = (first + step) % n;
    let count = step === 0 ? 3 : 2;
    if (seat === cutter && isJoker(cutCard)) count -= 1;
    for (let k = 0; k < count; k++) hands[seat].push(deck.shift());
  }
  for (let round = 0; round < 6; round++)
    for (let step = 0; step < n; step++) {
      const seat = (first + step) % n;
      hands[seat].push(deck.shift());
      hands[seat].push(deck.shift());
    }
  if (faceUp) deck.push(faceUp);
  return { hands, drawPile: deck, faceUpBottomCard: faceUp, dealer, firstPlayer: first, cutter };
}

// ---------- Melds ----------

function positionPoints(p) {
  if (p === 1) return 1;
  if (p >= 2 && p <= 9) return p;
  return 10;
}

/** A set: 3 or 4 cards of the same rank, all in different suits. Jokers fill the gaps. */
function makeSet(cards) {
  if (cards.length !== 3 && cards.length !== 4) return null;
  const naturals = cards.filter((c) => !isJoker(c));
  if (naturals.length === 0) return null;
  const rank = naturals[0].rank;
  if (!naturals.every((c) => c.rank === rank)) return null;
  const suits = naturals.map((c) => c.suit);
  if (new Set(suits).size !== suits.length) return null;
  const perCard = rank === 1 ? 10 : positionPoints(rank);
  return { kind: 'set', cards: cards.slice(), positions: [], points: perCard * cards.length };
}

/** Every way these cards can make a run (bridge): same suit, in order, ace low or high, 3 to 14 cards. */
function makeRuns(cards) {
  const n = cards.length;
  if (n < 3 || n > 14) return [];
  const naturals = cards.filter((c) => !isJoker(c));
  const jokers = cards.filter(isJoker);
  if (naturals.length === 0) return [];
  const suit = naturals[0].suit;
  if (!naturals.every((c) => c.suit === suit)) return [];

  const results = [];
  for (let start = 1; start <= 15 - n; start++) {
    const end = start + n - 1;
    const slots = new Array(n).fill(null);
    const place = (index) => {
      if (index === naturals.length) {
        const left = jokers.slice();
        const ordered = [], positions = [];
        let total = 0;
        for (let i = 0; i < n; i++) {
          const position = start + i;
          ordered.push(slots[i] !== null ? slots[i] : left.pop());
          positions.push(position);
          total += positionPoints(position);
        }
        results.push({ kind: 'run', cards: ordered, positions, points: total });
        return;
      }
      const card = naturals[index];
      const options = card.rank === 1 ? [1, 14] : [card.rank];
      for (const position of options) {
        if (position >= start && position <= end && slots[position - start] === null) {
          slots[position - start] = card;
          place(index + 1);
          slots[position - start] = null;
        }
      }
    };
    place(0);
  }
  return results;
}

/** The valid meld with the most points these cards can make, or null. */
function bestMeld(cards) {
  const options = makeRuns(cards);
  const set = makeSet(cards);
  if (set) options.push(set);
  let best = null;
  for (const m of options) if (best === null || m.points > best.points) best = m;
  return best;
}

// ---------- Opening ----------

function popcount(x) { let c = 0; while (x) { x &= x - 1; c++; } return c; }
function ctz(x) { return 31 - Math.clz32(x & -x); }

/** Every valid meld inside a hand: { mask, meld }. Only groups of one suit or one rank (plus jokers) are tried. */
function meldCandidates(hand) {
  const n = hand.length;
  const jokerPositions = [];
  let naturalMask = 0;
  for (let i = 0; i < n; i++) {
    if (isJoker(hand[i])) jokerPositions.push(i); else naturalMask |= 1 << i;
  }
  const masks = new Set();
  const addGroups = (positions, minSize, maxSize) => {
    const count = positions.length;
    if (count < minSize) return;
    for (let pick = 1; pick < (1 << count); pick++) {
      const size = popcount(pick);
      if (size < minSize || size > maxSize) continue;
      let mask = 0;
      for (let k = 0; k < count; k++) if (pick & (1 << k)) mask |= 1 << positions[k];
      if (mask & naturalMask) masks.add(mask);
    }
  };
  for (const suit of SUITS) {
    const suited = [];
    for (let i = 0; i < n; i++) if (hand[i].suit === suit) suited.push(i);
    if (suited.length) addGroups(suited.concat(jokerPositions), 3, 14);
  }
  for (let rank = 1; rank <= 13; rank++) {
    const ranked = [];
    for (let i = 0; i < n; i++) if (hand[i].rank === rank) ranked.push(i);
    if (ranked.length) addGroups(ranked.concat(jokerPositions), 3, 4);
  }
  const result = [];
  for (const mask of Array.from(masks).sort((a, b) => a - b)) {
    const cards = [];
    for (let i = 0; i < n; i++) if (mask & (1 << i)) cards.push(hand[i]);
    const meld = bestMeld(cards);
    if (meld) result.push({ mask, meld });
  }
  return result;
}

/**
 * The way to lay down melds from this hand that gives the most points.
 * mustUse: a card that has to be inside the melds (the thrown card you took to open).
 * keepOneToDiscard: at least one card must stay out of the melds.
 * Returns { melds, points, leftover, canOpen } or null when mustUse fits no meld.
 */
function bestOpening(hand, mustUse, keepOneToDiscard) {
  if (keepOneToDiscard === undefined) keepOneToDiscard = true;
  const n = hand.length;
  if (n === 0 || n > 16) return null;
  const full = (1 << n) - 1;
  const candidates = meldCandidates(hand);

  const byLow = [];
  for (let i = 0; i < n; i++) byLow.push([]);
  candidates.forEach((c, index) => byLow[ctz(c.mask)].push(index));

  const best = new Int32Array(full + 1);
  const choice = new Int32Array(full + 1).fill(-1);
  for (let mask = 1; mask <= full; mask++) {
    const low = ctz(mask);
    best[mask] = best[mask & ~(1 << low)];
    choice[mask] = -1;
    for (const index of byLow[low]) {
      const m = candidates[index].mask;
      if ((m & mask) === m) {
        const value = best[mask & ~m] + candidates[index].meld.points;
        if (value > best[mask]) { best[mask] = value; choice[mask] = index; }
      }
    }
  }
  const collect = (start) => {
    let mask = start;
    const picked = [];
    while (mask !== 0) {
      const index = choice[mask];
      if (index === -1) mask &= ~(1 << ctz(mask));
      else { picked.push(candidates[index]); mask &= ~candidates[index].mask; }
    }
    return picked;
  };

  let bestValue = -1;
  let bestPicked = [];
  if (mustUse) {
    const requiredIndex = hand.findIndex((c) => c.id === mustUse.id);
    if (requiredIndex < 0) return null;
    for (const candidate of candidates) {
      if (!(candidate.mask & (1 << requiredIndex))) continue;
      const rest = full & ~candidate.mask;
      if (keepOneToDiscard) {
        if (rest === 0) continue;
        for (let d = 0; d < n; d++) {
          if (!(rest & (1 << d))) continue;
          const restMask = rest & ~(1 << d);
          const value = candidate.meld.points + best[restMask];
          if (value > bestValue) { bestValue = value; bestPicked = [candidate].concat(collect(restMask)); }
        }
      } else {
        const value = candidate.meld.points + best[rest];
        if (value > bestValue) { bestValue = value; bestPicked = [candidate].concat(collect(rest)); }
      }
    }
    if (bestValue < 0) return null;
  } else if (keepOneToDiscard) {
    for (let d = 0; d < n; d++) {
      const restMask = full & ~(1 << d);
      if (best[restMask] > bestValue) { bestValue = best[restMask]; bestPicked = collect(restMask); }
    }
  } else {
    bestValue = best[full];
    bestPicked = collect(full);
  }

  let used = 0;
  for (const c of bestPicked) used |= c.mask;
  const leftover = hand.filter((_, i) => !(used & (1 << i)));
  return { melds: bestPicked.map((c) => c.meld), points: bestValue, leftover, canOpen: bestValue >= OPENING_MINIMUM };
}

/** Can this 15-card hand lay down 14 cards in melds (51+ points) and keep one to throw? That is a Hand. */
function handCloseGroups(hand) {
  const n = hand.length;
  if (n !== 15) return null;
  const full = (1 << n) - 1;
  const maskOf = [], pointsOf = [];
  const byLow = [];
  for (let i = 0; i < n; i++) byLow.push([]);
  for (const c of meldCandidates(hand)) {
    byLow[ctz(c.mask)].push(maskOf.length);
    maskOf.push(c.mask);
    pointsOf.push(c.meld.points);
  }
  const best = new Int32Array(full + 1).fill(-1);
  const choice = new Int32Array(full + 1).fill(-1);
  best[0] = 0;
  for (let mask = 1; mask <= full; mask++) {
    const low = ctz(mask);
    for (const index of byLow[low]) {
      const m = maskOf[index];
      if ((m & mask) === m && best[mask & ~m] >= 0) {
        const value = best[mask & ~m] + pointsOf[index];
        if (value > best[mask]) { best[mask] = value; choice[mask] = index; }
      }
    }
  }
  let bestMask = -1, bestValue = -1;
  for (let d = 0; d < n; d++) {
    const mask = full & ~(1 << d);
    if (best[mask] > bestValue) { bestValue = best[mask]; bestMask = mask; }
  }
  if (bestMask < 0 || bestValue < OPENING_MINIMUM) return null;
  const groups = [];
  let mask = bestMask;
  while (mask !== 0) {
    const m = maskOf[choice[mask]];
    groups.push(hand.filter((_, i) => m & (1 << i)));
    mask &= ~m;
  }
  return groups;
}

// ---------- Melds on the table ----------

function makeTableMeld(meld, owner) {
  return { owner, kind: meld.kind, cards: meld.cards.slice(), positions: meld.positions.slice() };
}
function runSuit(m) { const c = m.cards.find((x) => !isJoker(x)); return c ? c.suit : null; }
function setRank(m) { const c = m.cards.find((x) => !isJoker(x)); return c ? c.rank : null; }

/** "Sell" a card onto a meld. Returns the new meld, or null if it doesn't fit. */
function adding(m, card, atHighEnd) {
  if (atHighEnd === undefined) atHighEnd = true;
  if (m.kind === 'run') {
    if (m.cards.length >= 14) return null;
    const low = m.positions[0], high = m.positions[m.positions.length - 1];
    const fits = (position) => {
      if (isJoker(card)) return true;
      if (card.suit !== runSuit(m)) return false;
      return card.rank === position || (card.rank === 1 && position === 14);
    };
    const lowFits = low > 1 && fits(low - 1);
    const highFits = high < 14 && fits(high + 1);
    if (highFits && (atHighEnd || !lowFits))
      return { owner: m.owner, kind: m.kind, cards: m.cards.concat([card]), positions: m.positions.concat([high + 1]) };
    if (lowFits)
      return { owner: m.owner, kind: m.kind, cards: [card].concat(m.cards), positions: [low - 1].concat(m.positions) };
    return null;
  }
  if (m.cards.length >= 4) return null;
  if (!isJoker(card)) {
    if (card.rank !== setRank(m)) return null;
    if (m.cards.some((x) => !isJoker(x) && x.suit === card.suit)) return null;
  }
  return { owner: m.owner, kind: m.kind, cards: m.cards.concat([card]), positions: [] };
}

/**
 * Take a joker off a meld by laying real card(s) in its place. Returns { meld, joker } or null.
 * Run: the one real card the joker stands for.
 * Set: a real card for EVERY suit the joker could be (that makes a full set of four).
 */
function takingJoker(m, given) {
  if (!m.cards.some(isJoker)) return null;
  if (given.length === 0 || given.some(isJoker)) return null;
  if (m.kind === 'run') {
    if (given.length !== 1 || given[0].suit !== runSuit(m)) return null;
    const rank = given[0].rank;
    const index = m.cards.findIndex((c, i) => isJoker(c) && (m.positions[i] === rank || (rank === 1 && m.positions[i] === 14)));
    if (index < 0) return null;
    const cards = m.cards.slice();
    const joker = cards[index];
    cards[index] = given[0];
    return { meld: { owner: m.owner, kind: m.kind, cards, positions: m.positions.slice() }, joker };
  }
  const naturals = m.cards.filter((c) => !isJoker(c));
  if (naturals.length === 0) return null;
  const rank = naturals[0].rank;
  const jokerCount = m.cards.length - naturals.length;
  const missing = 4 - naturals.length;
  if (given.length !== missing - jokerCount + 1) return null;
  const onTable = new Set(naturals.map((c) => c.suit));
  const givenSuits = given.map((c) => c.suit);
  if (!given.every((c) => c.rank === rank)) return null;
  if (new Set(givenSuits).size !== givenSuits.length) return null;
  if (givenSuits.some((s) => onTable.has(s))) return null;
  const removed = m.cards.find(isJoker);
  const others = m.cards.filter((c) => isJoker(c) && c.id !== removed.id);
  return { meld: { owner: m.owner, kind: m.kind, cards: naturals.concat(given, others), positions: [] }, joker: removed };
}

/** "E shitur": a card that fits a meld on the table. Jokers don't count here. */
function isSellable(card, table) {
  if (isJoker(card)) return false;
  return table.some((m) => adding(m, card) !== null);
}

/** The cards the player may throw. A joker can't be thrown unless it is the last card.
 *  A player who hasn't opened can't throw a card that fits a meld on the table. */
function legalDiscards(hand, hasOpened, table) {
  if (hand.length === 1) return hand.slice();
  let allowed = hand.filter((c) => !isJoker(c));
  if (!hasOpened) allowed = allowed.filter((c) => !isSellable(c, table));
  return allowed.length === 0 ? hand.slice() : allowed;
}

// ---------- Closing and scoring ----------

const CLOSER_POINTS = { normal: -40, normalWithJoker: -80, hand: -120, handWithJoker: -200, ngjyre: -800 };
const isBigClose = (t) => t === 'hand' || t === 'handWithJoker' || t === 'ngjyre';

/** A Ngjyre: 14 cards in one suit, ace low, 2 to king, ace high. No joker. */
function isNgjyre(meld) {
  return meld.kind === 'run' && meld.cards.length === 14 && !meld.cards.some(isJoker);
}

function closeType(turn) {
  const withJoker = isJoker(turn.closingCard);
  if (!turn.openedBeforeThisTurn && turn.ownMelds.some(isNgjyre)) return 'ngjyre';
  if (!turn.openedBeforeThisTurn && turn.cardsPlacedOnOthersMelds.length === 0)
    return withJoker ? 'handWithJoker' : 'hand';
  return withJoker ? 'normalWithJoker' : 'normal';
}

function roundScores(closer, type, players) {
  return players.map((p, seat) => {
    if (seat === closer) return CLOSER_POINTS[type];
    if (!p.hasOpened) return isBigClose(type) ? 200 : 100;
    const total = p.cardsInHand.reduce((s, c) => s + handPoints(c), 0);
    return isBigClose(type) ? total * 2 : total;
  });
}

function dealerForRound(round, firstDealer, playerCount) { return (firstDealer + round) % (playerCount || 4); }

// ---------- One round ----------

class MoveError extends Error {
  constructor(code) { super(code); this.code = code; }
}

function removing(cards, hand) {
  const remaining = hand.slice();
  for (const card of cards) {
    const index = remaining.findIndex((c) => c.id === card.id);
    if (index < 0) return null;
    remaining.splice(index, 1);
  }
  return remaining;
}

class GameRound {
  constructor(deal) {
    this.players = deal.hands.map((h) => ({ hand: h.slice(), hasOpened: false }));
    this.drawPile = deal.drawPile.slice();
    this.discardPile = [];
    this.table = [];
    this.bottomCard = deal.faceUpBottomCard;
    this.current = deal.firstPlayer;
    this.phase = 'firstDiscard';       // firstDiscard | draw | play | finished
    this.turn = { openedBeforeThisTurn: false, meldsLaid: [], cardsPlacedOnOthersMelds: [] };
    this.result = null;
  }

  clone() {
    const copy = Object.create(GameRound.prototype);
    Object.assign(copy, JSON.parse(JSON.stringify(this)));
    return copy;
  }

  /** Do one move. If it is not allowed this throws a MoveError and nothing changes. */
  perform(move) {
    const next = this.clone();
    next._apply(move);
    Object.assign(this, next);
  }

  _apply(move) {
    const t = move.type;
    switch (this.phase) {
      case 'finished':
        throw new MoveError('wrongPhase');
      case 'firstDiscard':
        if (t !== 'discard') throw new MoveError('wrongPhase');
        return this._discard(move.card);
      case 'draw':
        if (t === 'drawFromPile') return this._drawFromPile();
        if (t === 'takeDiscard') return this._takeDiscard();
        if (t === 'takeDiscardAndOpen') return this._takeDiscardAndOpen(move.groups);
        if (t === 'takeBottomCard') return this._takeBottomCard();
        throw new MoveError('wrongPhase');
      case 'play':
        if (t === 'layDown') return this._layDown(move.groups);
        if (t === 'sell') return this._sell(move.card, move.meld, move.atHighEnd);
        if (t === 'takeJoker') return this._takeJoker(move.meld, move.giving);
        if (t === 'discard') return this._discard(move.card);
        throw new MoveError('wrongPhase');
    }
  }

  get me() { return this.players[this.current]; }

  _drawFromPile() {
    if (this.drawPile.length === 0) this._refill();
    if (this.drawPile.length === 0) throw new MoveError('noCardsLeft');
    this.me.hand.push(this.drawPile.shift());
    this._forgetBottomCardIfGone();
    this.phase = 'play';
  }
  _refill() {
    if (this.discardPile.length <= 1) throw new MoveError('noCardsLeft');
    const top = this.discardPile.pop();
    this.drawPile = shuffle(this.discardPile.slice());
    this.discardPile = [top];
    this.bottomCard = null;
  }
  _forgetBottomCardIfGone() {
    if (this.bottomCard) {
      const last = this.drawPile[this.drawPile.length - 1];
      if (!last || last.id !== this.bottomCard.id) this.bottomCard = null;
    }
  }
  _takeDiscard() {
    if (!this.me.hasOpened) throw new MoveError('mustOpenFirst');
    if (this.discardPile.length === 0) throw new MoveError('discardPileEmpty');
    this.me.hand.push(this.discardPile.pop());
    this.phase = 'play';
  }
  _takeDiscardAndOpen(groups) {
    if (this.me.hasOpened) throw new MoveError('wrongPhase');
    if (this.discardPile.length === 0) throw new MoveError('discardPileEmpty');
    const card = this.discardPile[this.discardPile.length - 1];
    if (!groups.some((g) => g.some((c) => c.id === card.id))) throw new MoveError('discardMustBeInMelds');
    this.discardPile.pop();
    this.me.hand.push(card);
    this._layDown(groups);
    this.phase = 'play';
  }
  _takeBottomCard() {
    const last = this.drawPile[this.drawPile.length - 1];
    if (!this.bottomCard || !last || last.id !== this.bottomCard.id) throw new MoveError('noBottomCard');
    if (this.me.hasOpened) throw new MoveError('bottomCardIsNotAHand');
    const hand = this.me.hand.concat([this.bottomCard]);
    if (!handCloseGroups(hand)) throw new MoveError('bottomCardIsNotAHand');
    this.drawPile.pop();
    this.me.hand = hand;
    this.bottomCard = null;
    this.phase = 'play';
  }
  _layDown(groups) {
    if (!groups || groups.length === 0) throw new MoveError('notAValidMeld');
    let remaining = this.me.hand;
    const melds = [];
    for (const group of groups) {
      const left = removing(group, remaining);
      if (left === null) throw new MoveError('cardNotInHand');
      const meld = bestMeld(group);
      if (meld === null) throw new MoveError('notAValidMeld');
      remaining = left;
      melds.push(meld);
    }
    if (remaining.length === 0) throw new MoveError('mustKeepOneCard');
    if (!this.me.hasOpened) {
      const total = melds.reduce((s, m) => s + m.points, 0);
      if (total < OPENING_MINIMUM) throw new MoveError('notEnoughToOpen');
      this.me.hasOpened = true;
    }
    this.me.hand = remaining;
    for (const meld of melds) this.table.push(makeTableMeld(meld, this.current));
    this.turn.meldsLaid = this.turn.meldsLaid.concat(melds);
  }
  _sell(card, index, atHighEnd) {
    if (!this.me.hasOpened) throw new MoveError('mustOpenFirst');
    if (!(index >= 0 && index < this.table.length)) throw new MoveError('badMeldIndex');
    const remaining = removing([card], this.me.hand);
    if (remaining === null) throw new MoveError('cardNotInHand');
    if (remaining.length === 0) throw new MoveError('mustKeepOneCard');
    const updated = adding(this.table[index], card, atHighEnd === undefined ? true : atHighEnd);
    if (updated === null) throw new MoveError('cardCantBeSold');
    if (this.table[index].owner !== this.current) this.turn.cardsPlacedOnOthersMelds.push(card);
    this.table[index] = updated;
    this.me.hand = remaining;
  }
  _takeJoker(index, giving) {
    if (!this.me.hasOpened) throw new MoveError('mustOpenFirst');
    if (!(index >= 0 && index < this.table.length)) throw new MoveError('badMeldIndex');
    const remaining = removing(giving, this.me.hand);
    if (remaining === null) throw new MoveError('cardNotInHand');
    const swap = takingJoker(this.table[index], giving);
    if (swap === null) throw new MoveError('cannotTakeJoker');
    if (this.table[index].owner !== this.current) this.turn.cardsPlacedOnOthersMelds.push(...giving);
    this.table[index] = swap.meld;
    this.me.hand = remaining.concat([swap.joker]);
  }
  _discard(card) {
    const hand = this.me.hand;
    if (!hand.some((c) => c.id === card.id)) throw new MoveError('cardNotInHand');
    const allowed = legalDiscards(hand, this.me.hasOpened, this.table);
    if (!allowed.some((c) => c.id === card.id)) throw new MoveError('illegalDiscard');
    this.me.hand = hand.filter((c) => c.id !== card.id);
    if (this.me.hand.length === 0) this._closeRound(card);
    else {
      this.discardPile.push(card);
      this._startTurn((this.current + 1) % this.players.length);
    }
  }
  _startTurn(seat) {
    this.current = seat;
    this.phase = 'draw';
    this.turn = { openedBeforeThisTurn: this.players[seat].hasOpened, meldsLaid: [], cardsPlacedOnOthersMelds: [] };
  }
  _closeRound(closingCard) {
    this.discardPile.push(closingCard);
    const type = closeType({
      openedBeforeThisTurn: this.turn.openedBeforeThisTurn,
      ownMelds: this.turn.meldsLaid,
      cardsPlacedOnOthersMelds: this.turn.cardsPlacedOnOthersMelds,
      closingCard,
    });
    const states = this.players.map((p) => ({ hasOpened: p.hasOpened, cardsInHand: p.hand }));
    this.result = { closer: this.current, closeType: type, scores: roundScores(this.current, type, states) };
    this.phase = 'finished';
  }
}

// ---------- The match: 8 rounds ----------

class ZholMatch {
  constructor(playerCount) {
    this.playerCount = playerCount || 4;                    // 2, 3 or 4 players
    this.firstDealer = Math.floor(random() * this.playerCount);   // the first dealer is random
    this.totals = new Array(this.playerCount).fill(0);
    this.roundsPlayed = 0;
    this.round = new GameRound(dealRound(this.firstDealer, undefined, this.playerCount));
  }
  get isFinished() { return this.roundsPlayed >= TOTAL_ROUNDS; }
  get leaders() {
    const lowest = Math.min(...this.totals);
    return this.totals.map((t, i) => (t === lowest ? i : -1)).filter((i) => i >= 0);
  }
  get dealer() { return dealerForRound(this.roundsPlayed, this.firstDealer, this.playerCount); }
  /** Call when the round is finished: adds its scores and deals the next round. */
  startNextRound() {
    if (!this.round.result || this.isFinished) return;
    for (let s = 0; s < this.playerCount; s++) this.totals[s] += this.round.result.scores[s];
    this.roundsPlayed += 1;
    if (!this.isFinished) this.round = new GameRound(dealRound(this.dealer, undefined, this.playerCount));
  }
}

// ---------- The bot ----------

function rankDistance(a, b) {
  let d = Math.abs(a - b);
  if (a === 1) d = Math.min(d, Math.abs(14 - b));
  if (b === 1) d = Math.min(d, Math.abs(a - 14));
  return d;
}

function usefulness(card, hand) {
  if (isJoker(card)) return 100;
  let score = 0;
  for (const other of hand) {
    if (other.id === card.id || isJoker(other)) continue;
    if (other.rank === card.rank && other.suit !== card.suit) score += 2;
    if (other.suit === card.suit) {
      const d = rankDistance(card.rank, other.rank);
      if (d === 1) score += 3; else if (d === 2) score += 2;
    }
  }
  return score;
}

function chooseDiscard(round) {
  const p = round.players[round.current];
  const allowed = legalDiscards(p.hand, p.hasOpened, round.table);
  let best = null, bestU = 0;
  for (const c of allowed) {
    const u = usefulness(c, p.hand);
    if (best === null || u < bestU || (u === bestU && handPoints(c) > handPoints(best))) { best = c; bestU = u; }
  }
  return best || p.hand[0];
}

function jokerMove(round, hand) {
  for (let index = 0; index < round.table.length; index++) {
    const meld = round.table[index];
    if (!meld.cards.some(isJoker)) continue;
    if (meld.kind === 'run') {
      for (const card of hand) {
        if (!isJoker(card) && takingJoker(meld, [card])) return { type: 'takeJoker', meld: index, giving: [card] };
      }
    } else {
      const onTable = new Set(meld.cards.filter((c) => !isJoker(c)).map((c) => c.suit));
      const rank = setRank(meld);
      const candidates = [];
      for (const card of hand) {
        if (isJoker(card) || card.rank !== rank || onTable.has(card.suit)) continue;
        if (!candidates.some((c) => c.suit === card.suit)) candidates.push(card);
      }
      for (let size = Math.min(3, candidates.length); size >= 1; size--) {
        const giving = candidates.slice(0, size);
        if (takingJoker(meld, giving)) return { type: 'takeJoker', meld: index, giving };
      }
    }
  }
  return null;
}

function sellMove(round, hand) {
  if (hand.length <= 1) return null;
  const ordered = hand.filter((c) => !isJoker(c)).concat(hand.filter(isJoker));
  for (const card of ordered)
    for (let index = 0; index < round.table.length; index++)
      if (adding(round.table[index], card) !== null) return { type: 'sell', card, meld: index, atHighEnd: true };
  return null;
}

/** The next move for the player whose turn it is, or null when the round is over. */
function botNextMove(round) {
  if (round.phase === 'finished') return null;
  const p = round.players[round.current];
  const hand = p.hand;
  if (round.phase === 'firstDiscard') return { type: 'discard', card: chooseDiscard(round) };

  if (round.phase === 'draw') {
    const top = round.discardPile[round.discardPile.length - 1];
    if (top) {
      if (!p.hasOpened) {
        const plan = bestOpening(hand.concat([top]), top);
        if (plan && plan.canOpen) return { type: 'takeDiscardAndOpen', groups: plan.melds.map((m) => m.cards) };
      } else if (isSellable(top, round.table) || bestOpening(hand.concat([top]), top) !== null) {
        return { type: 'takeDiscard' };
      }
    }
    if (!p.hasOpened && round.bottomCard && handCloseGroups(hand.concat([round.bottomCard])) !== null)
      return { type: 'takeBottomCard' };
    return { type: 'drawFromPile' };
  }

  // play
  if (!p.hasOpened) {
    const plan = bestOpening(hand);
    if (plan && plan.canOpen) return { type: 'layDown', groups: plan.melds.map((m) => m.cards) };
    return { type: 'discard', card: chooseDiscard(round) };
  }
  const plan = bestOpening(hand);
  if (plan && plan.points > 0) return { type: 'layDown', groups: plan.melds.map((m) => m.cards) };
  const joker = jokerMove(round, hand);
  if (joker) return joker;
  const sell = sellMove(round, hand);
  if (sell) return sell;
  return { type: 'discard', card: chooseDiscard(round) };
}

/** The simplest legal move, used if a chosen move is refused so the game never hangs. */
function botFallbackMove(round) {
  if (round.phase === 'draw') return { type: 'drawFromPile' };
  if (round.phase === 'firstDiscard' || round.phase === 'play') {
    const p = round.players[round.current];
    const allowed = legalDiscards(p.hand, p.hasOpened, round.table);
    if (allowed.length) return { type: 'discard', card: allowed[0] };
  }
  return null;
}

/** Does ONE bot move for the current player. Returns the move that was done (or null). */
function botPlayOneMove(round) {
  const move = botNextMove(round);
  if (move) {
    try { round.perform(move); return move; } catch (e) { if (!(e instanceof MoveError)) throw e; }
  }
  const fallback = botFallbackMove(round);
  if (fallback) { try { round.perform(fallback); return fallback; } catch (e) { if (!(e instanceof MoveError)) throw e; } }
  return null;
}

return {

  isNgjyre, closeType, roundScores, dealerForRound,

  botNextMove, botFallbackMove, botPlayOneMove,
};

/** The text for a key in the chosen language. Some texts take values: t('players', 3). */
function t(key) {
  const lang = (typeof ui !== 'undefined' && ui.lang === 'en') ? 'en' : 'sq';
  let v = STR[lang][key];
  if (v === undefined) v = STR.sq[key];
  if (typeof v === 'function') return v.apply(null, Array.prototype.slice.call(arguments, 1));
  return v;
}
function errText(code, fallback) {
  const lang = (typeof ui !== 'undefined' && ui.lang === 'en') ? 'en' : 'sq';
  const d = STR[lang].err;
  return d[code] || d[fallback || 'generic'];
}

function describe(ev) {
  const you = ev.seat === A().mySeat();
  const name = esc(A().names()[ev.seat]);
  const c = ev.card ? cardText(ev.card) : '';
  switch (ev.type) {
    case 'drawFromPile': return t('eDraw', you, name, c);
    case 'takeDiscard': return t('eTake', you, name, c);
    case 'takeDiscardAndOpen': return t('eTakeOpen', you, name, c);
    case 'takeBottomCard': return t('eBottom', you, name);
    case 'layDown': return t('eLay', you, name, ev.count);
    case 'sell': return t('eSell', you, name, c);
    case 'takeJoker': return t('eJoker', you, name);
    case 'discard': return t('eThrow', you, name, c);
    default: return '';
  }
}

/** How long a computer player waits before its next move, so you can follow what happened. */
function pauseAfter(ev) {
  if (BOT_DELAY === 0 || !ev) return BOT_DELAY;
  if (ev.type === 'layDown' || ev.type === 'takeDiscardAndOpen') return BOT_DELAY + 1400;
  if (ev.type === 'sell' || ev.type === 'takeJoker') return BOT_DELAY + 700;
  return BOT_DELAY;
}

const solo = {
  match: null, token: 0, seq: 0,
  start() { this.match = new Z.ZholMatch(); this.token++; this.seq = 0; },
  round() { return this.match.round; },
  roundKey() { return this.match.round; },
  mySeat() { return 0; },
  names() { return [t('you')].concat(SOLO_NAMES.slice(1)); },
  seatInfo(seat) { return { isBot: seat !== 0, connected: true, botPlaying: false }; },
  totals() { return this.match.totals; },
  dealer() { return this.match.dealer; },
  roundsPlayed() { return this.match.roundsPlayed; },
  isHost() { return true; },
  hostName() { return t('you'); },
  perform(seat, move) {
    const r = this.match.round;
    const topBefore = r.discardPile.length ? r.discardPile[r.discardPile.length - 1] : null;
    const handBefore = new Set(r.players[seat].hand.map((c) => c.id));
    try { r.perform(move); } catch (e) { if (e instanceof Z.MoveError) return e.code; throw e; }
    let card = null;
    if (['drawFromPile', 'takeDiscard', 'takeBottomCard'].includes(move.type)) card = r.players[seat].hand.find((c) => !handBefore.has(c.id)) || null;
    else if (move.type === 'takeDiscardAndOpen') card = topBefore;
    else if (move.type === 'discard' || move.type === 'sell') card = move.card;
    else if (move.type === 'takeJoker') card = r.players[seat].hand.find((c) => !handBefore.has(c.id)) || null;
    const ev = { seq: ++this.seq, seat, type: move.type, card, count: move.groups ? move.groups.length : 0,
                 meld: move.meld !== undefined ? move.meld : null, cards: move.giving || null };
    this.lastEvent = ev;
    onGameChange(ev);
    if (seat === 0) this.scheduleBots();
    return true;
  },
  send(move) { return this.perform(0, move); },
  scheduleBots() {
    const token = ++this.token;
    const step = () => {
      if (token !== this.token || ui.mode !== 'solo') return;
      const r = this.match.round;
      if (r.phase === 'finished' || r.current === 0) { onGameChange(null); return; }
      const seat = r.current;
      const move = Z.botNextMove(r);
      if (!move || this.perform(seat, move) !== true) {
        const fb = Z.botFallbackMove(this.match.round);
        if (fb) this.perform(seat, fb);
      }
      setTimeout(step, pauseAfter(this.lastEvent));
    };
    const r = this.match.round;
    if (r.phase !== 'finished' && r.current !== 0) setTimeout(step, BOT_DELAY);
  },
  nextRound() {
    if (this.match.roundsPlayed + 1 >= Z.TOTAL_ROUNDS) this.start(); else this.match.startNextRound();
    this.token++;
    resetTurnState(); ui.lastAction = '';
    onGameChange(null);
    this.scheduleBots();
  },
  takeover() { /* nothing to do alone */ },
};

const online = {
  session: null,      // { code, token }
  state: null,        // the last view from the server
  view: null,         // a round-like object built from it
  es: null, connected: true, lostTimer: null,

  round() { return this.view; },
  roundKey() { return this.state.code + ':' + this.state.game.roundId; },
  mySeat() { return this.state.game.mySeat; },
  names() { const g = this.state.game; return g.seats.map((s, i) => (i === g.mySeat ? t('you') : s.name)); },
  seatInfo(seat) { const s = this.state.game.seats[seat]; return { isBot: s.isBot, connected: s.connected, botPlaying: s.botPlaying }; },
  totals() { return this.state.game.totals; },
  dealer() { return this.state.game.dealer; },
  roundsPlayed() { return this.state.game.roundsPlayed; },
  isHost() { return !!(this.state && this.state.you.isHost); },
  hostName() { const h = this.state && this.state.players.find((p) => p.isHost); return h ? h.name : ''; },

  /** Turns the server's view into the shape the table screen reads. */
  buildView() {
    const g = this.state.game;
    if (!g) { this.view = null; return; }
    this.view = {
      phase: g.phase,
      current: g.current,
      players: g.seats.map((s, i) => ({
        hand: i === g.mySeat ? g.myHand : Array.from({ length: s.handCount }, (_, k) => ({ id: -1 - i * 100 - k, rank: 0, suit: 'x' })),
        hasOpened: s.hasOpened,
      })),
      table: g.table,
      discardPile: g.discardTop ? [g.discardTop] : [],
      drawPile: { length: g.drawCount },
      bottomCard: g.bottomCard,
      result: g.result,
    };
  },

  async api(path, body) {
    let res;
    try {
      res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) { const err = new Error('network'); err.code = 'network'; throw err; }
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty */ }
    if (!res.ok) { const err = new Error(data.error || 'generic'); err.code = data.error || 'generic'; throw err; }
    return data;
  },

  connect(session) {
    this.disconnect();
    chat.synced = false;
    this.session = session;
    saveLocal('zhol.session', JSON.stringify(session));
    const es = new EventSource('/api/events?code=' + encodeURIComponent(session.code) + '&token=' + encodeURIComponent(session.token));
    this.es = es;
    es.onmessage = (msg) => { let s; try { s = JSON.parse(msg.data); } catch (e) { return; } this.onState(s); };
    es.onopen = () => { clearTimeout(this.lostTimer); if (!this.connected) { this.connected = true; render(); } };
    es.onerror = () => {
      clearTimeout(this.lostTimer);
      this.lostTimer = setTimeout(() => { if (this.es === es && es.readyState !== 1) { this.connected = false; render(); } }, 3000);
      if (es.readyState === 2) {        // the server said no (the game is gone): back to the start
        this.checkStillThere();
      }
    };
  },
  /** The live connection was closed by the server: is the game still there? If yes, connect again. */
  async checkStillThere() {
    const session = this.session;
    if (!session) return;
    try {
      await this.api('/api/check', session);
      setTimeout(() => { if (this.session === session) this.connect(session); }, 2000);
    } catch (e) {
      if (e.code === 'noGame' || e.code === 'badToken') { this.leaveLocal(); ui.formError = errText(e.code); render(); }
      else setTimeout(() => { if (this.session === session) this.checkStillThere(); }, 3000);
    }
  },
  disconnect() { if (this.es) { this.es.close(); this.es = null; } clearTimeout(this.lostTimer); this.connected = true; },
  leaveLocal() {
    this.disconnect();
    resetChat();
    this.session = null; this.state = null; this.view = null;
    saveLocal('zhol.session', null);
    ui.mode = null; ui.screen = 'home';
  },

  onState(s) {
    const firstGameView = !!s.game && !(this.state && this.state.game);
    this.state = s;
    onChatFromServer(s.chat || [], s.you.id);
    this.buildView();
    if (!s.started) { ui.mode = 'online'; ui.screen = 'lobby'; render(); return; }
    ui.mode = 'online'; ui.screen = 'game';
    const ev = s.game.event;
    if (firstGameView) { ui.lastEventSeq = ev ? ev.seq : 0; resetTurnState(); onGameChange(null); return; }
    if (ev && ev.seq > ui.lastEventSeq) { ui.lastEventSeq = ev.seq; onGameChange(ev); }
    else { if (!ev) { ui.lastEventSeq = 0; } onGameChange(null); }
  },

  serialize(move) {
    const ids = (cards) => cards.map((c) => c.id);
    const out = { type: move.type };
    if (move.groups) out.groups = move.groups.map(ids);
    if (move.card) out.card = move.card.id;
    if (move.giving) out.giving = ids(move.giving);
    if (move.meld !== undefined) out.meld = move.meld;
    if (move.atHighEnd !== undefined) out.atHighEnd = move.atHighEnd;
    return out;
  },
  send(move) {
    return this.api('/api/move', { code: this.session.code, token: this.session.token, move: this.serialize(move) })
      .then(() => true, (e) => e.code || 'generic');
  },
  nextRound() { this.api('/api/next', this.session).catch((e) => { ui.message = errText(e.code, 'generic'); render(); }); },
  takeover(seat, on) { this.api('/api/takeover', { code: this.session.code, token: this.session.token, seat, on }).catch(() => {}); },
};

const A = () => (ui.mode === 'solo' ? solo : online);

const round = () => A().round();
const mySeat = () => A().mySeat();
const me = () => round().players[mySeat()];
const isMyTurn = () => round().phase !== 'finished' && round().current === mySeat();
const topDiscard = () => { const p = round().discardPile; return p.length ? p[p.length - 1] : null; };
const seatCount = () => round().players.length;
const areaOf = (seat) => { const n = seatCount(); return AREAS[n][(seat - mySeat() + n) % n]; };

function resetTurnState() {
  ui.fresh = {};
  ui.selected = new Set(); ui.staged = []; ui.openingWithDiscard = false; ui.message = ''; ui.chooser = null; ui.newCardId = null;
}

function sortKey(card, mode) {
  if (Z.isJoker(card)) return [99, 0];
  const s = Z.SUITS.indexOf(card.suit);
  return mode === 'rank' ? [card.rank, s] : [s, card.rank];
}
function sorted(cards, mode) {
  return cards.slice().sort((a, b) => {
    const ka = sortKey(a, mode), kb = sortKey(b, mode);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    if (ka[1] !== kb[1]) return ka[1] - kb[1];
    return a.id - b.id;
  });
}
/** At the start of each round your hand is sorted once. After that it keeps YOUR order. */
function ensureOrder() {
  const key = A().roundKey();
  if (ui.orderKey !== key) { ui.order = sorted(me().hand, ui.sortMode).map((c) => c.id); ui.orderKey = key; }
}
function sortHand(mode) {
  ui.sortMode = mode; saveLocal('zhol.sortMode', mode);
  ensureOrder();
  ui.order = sorted(displayHand(), mode).map((c) => c.id);
  render();
}
function displayHand() {
  ensureOrder();
  const cards = me().hand.slice();
  if (ui.openingWithDiscard && topDiscard()) cards.push(topDiscard());
  const pos = new Map(ui.order.map((id, i) => [id, i]));
  const arrival = new Map(cards.map((c, i) => [c.id, i]));
  return cards.sort((a, b) => {
    const pa = pos.has(a.id) ? pos.get(a.id) : 100000 + arrival.get(a.id);
    const pb = pos.has(b.id) ? pos.get(b.id) : 100000 + arrival.get(b.id);
    return pa - pb;
  });
}
function moveCard(id, toIndex) {
  const row = availableHand().map((c) => c.id);
  if (!row.includes(id)) return;
  const others = row.filter((x) => x !== id);
  others.splice(Math.max(0, Math.min(toIndex, others.length)), 0, id);
  const rest = displayHand().map((c) => c.id).filter((x) => !others.includes(x));
  ui.order = others.concat(rest);
}
function stagedIds() { const s = new Set(); ui.staged.forEach((g) => g.forEach((c) => s.add(c.id))); return s; }
function availableHand() { const ids = stagedIds(); return displayHand().filter((c) => !ids.has(c.id)); }
function selectedCards() { return availableHand().filter((c) => ui.selected.has(c.id)); }
function meldPoints(group) { const m = Z.bestMeld(group); return m ? m.points : 0; }
function stagedPoints() { return ui.staged.reduce((s, g) => s + meldPoints(g), 0); }
function stagedContainsDiscard() { const t = topDiscard(); return !!t && ui.staged.some((g) => g.some((c) => c.id === t.id)); }
function canLayDown() {
  if (ui.staged.length === 0) return false;
  if (!me().hasOpened && stagedPoints() < Z.OPENING_MINIMUM) return false;
  if (ui.openingWithDiscard && !stagedContainsDiscard()) return false;
  return true;
}

function meldActions(meld, index) {
  const out = [];
  if (!isMyTurn() || round().phase !== 'play' || !me().hasOpened) return out;
  const sel = selectedCards();
  if (sel.length === 0) return out;
  if (sel.length === 1) {
    const card = sel[0];
    const high = Z.adding(meld, card, true);
    if (high) {
      const low = Z.adding(meld, card, false);
      if (low && JSON.stringify(low.positions) !== JSON.stringify(high.positions)) {
        out.push({ kind: 'sell', label: t('cStart', cardText(card)), move: { type: 'sell', card, meld: index, atHighEnd: false } });
        out.push({ kind: 'sell', label: t('cEnd', cardText(card)), move: { type: 'sell', card, meld: index, atHighEnd: true } });
      } else {
        out.push({ kind: 'sell', label: t('cSell', cardText(card)), move: { type: 'sell', card, meld: index, atHighEnd: true } });
      }
    }
  }
  if (Z.takingJoker(meld, sel)) {
    out.push({ kind: 'joker', label: t('cJoker', sel.map(cardText).join(', ')), move: { type: 'takeJoker', meld: index, giving: sel } });
  }
  return out;
}

function hint() {
  const r = round();
  if (r.phase === 'finished') return t('hRoundOver');
  if (!isMyTurn()) {
    const info = A().seatInfo(r.current);
    return t('hPlaying', esc(A().names()[r.current]), info.isBot || info.botPlaying);
  }
  if (r.phase === 'firstDiscard') return t('hYouStart');
  if (r.phase === 'draw') {
    if (ui.openingWithDiscard) return t('hOpenWithDiscard');
    return me().hasOpened ? t('hDrawOpened') : t('hDraw');
  }
  if (me().hasOpened) {
    if (selectedCards().length > 0 && r.table.some((m, i) => meldActions(m, i).length > 0)) return t('hTapGlowing');
    return t('hPlayOpened');
  }
  return t('hPlay');
}

// ============================================================
// Card animations
// ============================================================

const reduceMotion = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const EASE = 'cubic-bezier(0.22, 0.61, 0.36, 1)';      // starts quick, lands softly
function rectOf(id) { const el = document.getElementById(id); return el ? el.getBoundingClientRect() : null; }

/** Where things are on the screen right now (taken after every redraw). */
function snapshot() {
  if (ui.screen !== 'game' || !round()) return null;
  const cards = {}, refs = {};
  document.querySelectorAll('#hand .card[data-card]').forEach((el) => { cards[el.getAttribute('data-card')] = el.getBoundingClientRect(); });
  document.querySelectorAll('.card[data-ref]').forEach((el) => { refs[el.getAttribute('data-ref')] = el.getBoundingClientRect(); });
  return {
    deck: rectOf('deck'), discard: rectOf('discard'), bottom: rectOf('bottom-card'), cards, refs,
    seats: round().players.map((_, s) => rectOf(s === mySeat() ? 'hand' : 'seat-' + s)),
  };
}

/**
 * A card glides from one place to another along a soft arc, growing or shrinking to its new size.
 * The real card at the end (target) is hidden while the card is in the air, then lands with a small bump.
 */
function fly(from, to, card, opts) {
  opts = opts || {};
  const key = opts.landingKey || null;
  if (reduceMotion || !from || !to || !document.body.animate) return;
  const w = opts.fromWidth || CARD_PILE;
  const toW = opts.toWidth || w;
  const holder = document.createElement('div');
  holder.innerHTML = card ? cardHTML(card, w) : backHTML(w);
  const el = holder.firstChild;
  el.classList.add('flying');
  const hw = w / 2, hh = (w * 1.45) / 2;
  const x0 = from.left + from.width / 2 - hw, y0 = from.top + from.height / 2 - hh;
  const x1 = to.left + to.width / 2 - hw, y1 = to.top + to.height / 2 - hh;
  const dx = x1 - x0, dy = y1 - y0;
  const s1 = toW / w;
  const lift = Math.min(60, Math.hypot(dx, dy) * 0.18);          // a gentle arc, more for longer trips
  const turn = dx >= 0 ? 6 : -6;
  el.style.left = x0 + 'px';
  el.style.top = y0 + 'px';
  document.body.appendChild(el);
  if (key) {
    ui.landing[key] = (ui.landing[key] || 0) + 1;
    const now = landingElement(key);
    if (now) now.classList.add('landing');
  }
  const anim = el.animate([
    { transform: 'translate(0px, 0px) scale(1) rotate(0deg)', offset: 0 },
    { transform: 'translate(' + dx * 0.5 + 'px, ' + (dy * 0.5 - lift) + 'px) scale(' + ((1 + s1) / 2 * 1.05) + ') rotate(' + turn + 'deg)', offset: 0.5 },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + s1 + ') rotate(0deg)', offset: 1 },
  ], { duration: opts.duration || FLY_MS, easing: EASE, delay: opts.delay || 0, fill: 'backwards' });
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    el.remove();
    if (!key) return;
    ui.landing[key] -= 1;
    if (ui.landing[key] > 0) return;
    delete ui.landing[key];
    const landed = landingElement(key);                 // the card on the screen now (it may have been redrawn)
    if (landed) {
      landed.classList.remove('landing');
      if (landed.animate) landed.animate([{ transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 160, easing: 'ease-out' });
    }
  };
  anim.onfinish = done;
  anim.oncancel = done;
}

function landingElement(key) {
  if (key === 'discard') return document.querySelector('#discard .card');
  if (key.indexOf('ref:') === 0) return document.querySelector('.meld .card[data-ref="' + key.slice(4) + '"]');
  if (key.indexOf('card:') === 0) return document.querySelector('#hand .card[data-card="' + key.slice(5) + '"]');
  return null;
}

/** Shows how a card moved for something that just happened. before = places before it happened. */
function animateEvent(ev, before) {
  if (!before) return;
  const after = snapshot();
  if (!after) return;
  const mine = ev.seat === mySeat();
  const seatBox = after.seats[ev.seat] || before.seats[ev.seat];
  const handCard = (id) => document.querySelector('#hand .card[data-card="' + id + '"]');
  switch (ev.type) {
    case 'takeDiscardAndOpen': {
      const table = round().table;
      const first = table.length - ev.count;
      flyIntoMelds(ev, before, table.slice(first).map((m, k) => ({ meld: m, index: first + k, cards: m.cards })));
      break;
    }
    case 'drawFromPile': case 'takeBottomCard': case 'takeDiscard': {
      const from = ev.type === 'drawFromPile' ? before.deck
        : ev.type === 'takeBottomCard' ? (before.bottom || before.deck) : before.discard;
      let to = seatBox, toW = 26, landingKey = null;
      if (mine && ev.card && ev.type !== 'takeDiscardAndOpen') {
        const target = handCard(ev.card.id);
        if (target) { to = target.getBoundingClientRect(); toW = CARD_HAND; landingKey = 'card:' + ev.card.id; }
      }
      const face = (mine || ev.type !== 'drawFromPile') ? ev.card : null;
      fly(from, to, face, { fromWidth: CARD_PILE, toWidth: toW, landingKey });
      break;
    }
    case 'layDown': {
      const table = round().table;
      const first = table.length - ev.count;
      flyIntoMelds(ev, before, table.slice(first).map((m, k) => ({ meld: m, index: first + k, cards: m.cards })));
      break;
    }
    case 'sell': {
      const index = ev.meld;
      const meld = round().table[index];
      if (meld && ev.card) flyIntoMelds(ev, before, [{ meld, index, cards: [ev.card] }]);
      break;
    }
    case 'takeJoker': {
      const index = ev.meld;
      const meld = round().table[index];
      if (meld && ev.cards) flyIntoMelds(ev, before, [{ meld, index, cards: ev.cards }]);
      if (ev.card && before.refs[ev.card.id]) {                      // the joker goes to the player
        let to = seatBox, toW = 26, landingKey = null;
        if (mine) { const target = handCard(ev.card.id); if (target) { to = target.getBoundingClientRect(); toW = CARD_HAND; landingKey = 'card:' + ev.card.id; } }
        fly(before.refs[ev.card.id], to, ev.card, { fromWidth: CARD_MELD, toWidth: toW, landingKey, delay: 250 });
      }
      break;
    }
    case 'discard': {
      let from = before.seats[ev.seat], fromW = 30;
      if (mine && ev.card && before.cards[ev.card.id]) { from = before.cards[ev.card.id]; fromW = CARD_HAND; }
      fly(from, after.discard || before.discard, ev.card, { fromWidth: fromW, toWidth: CARD_PILE, landingKey: 'discard' });
      break;
    }
    default: break;
  }
}

/**
 * Cards fly one after another into melds on the table (laying down, opening, selling, giving cards for a joker).
 * Your own cards start from where they were in your hand (or in your prepared melds); other players' cards start
 * at their name. The thrown card you opened with starts from the pile. The meld then glows for a moment.
 */
function flyIntoMelds(ev, before, groups) {
  const mine = ev.seat === mySeat();
  const fromSeat = before.seats[ev.seat];
  let k = 0;
  groups.forEach((g) => {
    g.cards.forEach((card) => {
      const target = document.querySelector('.meld[data-index="' + g.index + '"] .card[data-ref="' + card.id + '"]');
      if (!target) return;
      let from = fromSeat, fromW = 26;
      if (ev.type === 'takeDiscardAndOpen' && ev.card && card.id === ev.card.id) { from = before.discard; fromW = CARD_PILE; }
      else if (mine && before.cards[card.id]) { from = before.cards[card.id]; fromW = CARD_HAND; }
      else if (mine && before.refs[card.id]) { from = before.refs[card.id]; fromW = CARD_STAGED; }
      fly(from, target.getBoundingClientRect(), card, { fromWidth: fromW, toWidth: CARD_MELD, landingKey: 'ref:' + card.id, delay: k * STAGGER_MS, duration: 600 });
      k += 1;
    });
    ui.fresh[g.index] = Date.now() + Math.max(0, k - 1) * STAGGER_MS + 450;    // glow when the cards arrive
  });
  if (!reduceMotion) setTimeout(() => { if (ui.screen === 'game') render(); }, Math.max(0, k - 1) * STAGGER_MS + 700 + FRESH_MS);
}

/** After you drop a dragged card, every card slides smoothly to its new place. */
function slideHand(oldRects, droppedId, ghostRect) {
  if (reduceMotion) return;
  document.querySelectorAll('#hand .card[data-card]').forEach((el) => {
    if (!el.animate) return;
    const id = el.getAttribute('data-card');
    const was = id === String(droppedId) && ghostRect ? ghostRect : oldRects[id];
    if (!was) return;
    const now = el.getBoundingClientRect();
    const dx = was.left - now.left, dy = was.top - now.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    const lift = el.classList.contains('sel') ? ' translateY(-14px)' : '';
    el.animate([{ transform: 'translate(' + dx + 'px, ' + dy + 'px)' + lift }, { transform: 'translate(0px, 0px)' + lift }],
      { duration: id === String(droppedId) ? 240 : 200, easing: EASE });
  });
}

/** Called after anything changed in the game (your move, a friend's move, a bot's move). */
function onGameChange(ev) {
  const before = ui.lastRects;
  if (ev) {
    ui.lastAction = describe(ev);
    if (ev.seat === mySeat()) {
      if (['drawFromPile', 'takeDiscard', 'takeBottomCard'].includes(ev.type) && ev.card) { ui.newCardId = ev.card.id; ui.scrollToNew = true; }
      if (ev.type === 'discard') ui.newCardId = null;
    }
  }
  if (round() && round().phase === 'finished') { ui.chooser = null; }
  refreshDrawOptions();
  render();
  if (ev) animateEvent(ev, before);
}

function refreshDrawOptions() {
  ui.canOpenWithDiscard = false; ui.canTakeBottom = false;
  if (!round() || !isMyTurn() || round().phase !== 'draw' || me().hasOpened) return;
  const top = topDiscard();
  if (top) { const plan = Z.bestOpening(me().hand.concat([top]), top); ui.canOpenWithDiscard = !!(plan && plan.canOpen); }
  if (round().bottomCard) ui.canTakeBottom = Z.handCloseGroups(me().hand.concat([round().bottomCard])) !== null;
}

// ============================================================
// Your actions at the table
// ============================================================

function perform(move) {
  if (ui.busy) return;
  const done = (res) => {
    ui.busy = false;
    if (res !== true) { ui.message = errText(res, 'generic'); render(); return; }
    ui.selected = new Set(); ui.staged = []; ui.openingWithDiscard = false; ui.message = ''; ui.chooser = null;
    render();
  };
  const res = A().send(move);
  if (res && typeof res.then === 'function') { ui.busy = true; res.then(done); } else done(res);
}

function toggleCard(id) { if (ui.selected.has(id)) ui.selected.delete(id); else ui.selected.add(id); ui.message = ''; render(); }
function makeMeld() {
  const cards = selectedCards();
  if (cards.length < 3) { ui.message = t('mPick3'); render(); return; }
  if (!Z.bestMeld(cards)) { ui.message = t('mNotMeld'); render(); return; }
  ui.staged.push(cards); ui.selected = new Set(); ui.message = ''; render();
}
function autoMeld() {
  const hand = me().hand.slice();
  let must;
  if (ui.openingWithDiscard && topDiscard()) { must = topDiscard(); hand.push(must); }
  const plan = Z.bestOpening(hand, must);
  if (!plan || plan.melds.length === 0) { ui.message = t('mNoMelds'); render(); return; }
  ui.staged = plan.melds.map((m) => m.cards.slice()); ui.selected = new Set(); ui.message = ''; render();
}
function layDownAction() {
  if (ui.staged.length === 0) return;
  perform({ type: ui.openingWithDiscard ? 'takeDiscardAndOpen' : 'layDown', groups: ui.staged });
}
function throwSelected() {
  const cards = selectedCards();
  if (cards.length !== 1) { ui.message = t('mTapOne'); render(); return; }
  perform({ type: 'discard', card: cards[0] });
}
function tapMeld(index) {
  const meld = round().table[index];
  if (!meld || !isMyTurn()) return;
  const options = meldActions(meld, index);
  if (options.length === 1) { perform(options[0].move); return; }
  if (options.length > 1) { ui.chooser = { options }; render(); return; }
  if (round().phase !== 'play') ui.message = t('mDrawFirst');
  else if (!me().hasOpened) ui.message = t('mOpenFirstSell');
  else if (selectedCards().length === 0) ui.message = t('mSelectFirst');
  else ui.message = t('mNoFit');
  render();
}

// ============================================================
// Start window, joining, waiting room
// ============================================================

function startSolo() {
  online.disconnect();
  ui.mode = 'solo'; ui.screen = 'game';
  solo.start();
  resetTurnState(); ui.lastAction = ''; ui.orderKey = null;
  onGameChange(null);
  solo.scheduleBots();
}

async function createGame() {
  const name = ui.name.trim();
  if (!name) { ui.formError = errText('noName'); render(); return; }
  saveLocal('zhol.name', name);
  ui.formError = ''; ui.busy = true; render();
  try {
    const r = await online.api('/api/create', { name });
    ui.busy = false;
    ui.mode = 'online'; ui.screen = 'lobby'; ui.lobbyNote = '';
    online.connect({ code: r.code, token: r.token });
    render();
  } catch (e) { ui.busy = false; ui.formError = errText(e.code, 'network'); render(); }
}

async function joinGame() {
  const name = ui.name.trim(), code = ui.code.trim().toUpperCase();
  if (!code) { ui.formError = t('typeCode'); render(); return; }
  if (!name) { ui.formError = errText('noName'); render(); return; }
  saveLocal('zhol.name', name);
  ui.formError = ''; ui.busy = true; render();
  try {
    const r = await online.api('/api/join', { code, name });
    ui.busy = false;
    ui.mode = 'online'; ui.screen = 'lobby'; ui.lobbyNote = '';
    online.connect({ code: r.code, token: r.token });
    render();
  } catch (e) { ui.busy = false; ui.formError = errText(e.code, 'network'); render(); }
}

async function startOnline() {
  try { await online.api('/api/start', online.session); } catch (e) { ui.lobbyNote = errText(e.code, 'network'); render(); }
}

async function leaveLobby() {
  const s = online.session;
  online.leaveLocal();
  render();
  if (s) { try { await online.api('/api/leave', s); } catch (e) { /* ignore */ } }
}

function goHome() {
  if (ui.mode === 'online') online.leaveLocal();
  solo.token++;
  ui.mode = null; ui.screen = 'home'; ui.showHelp = false; ui.chooser = null;
  render();
}

function shareLink() {
  const link = location.origin + location.pathname + '?kod=' + online.session.code;
  const text = t('shareText', online.session.code);
  if (navigator.share) { navigator.share({ title: 'Zhol', text, url: link }).catch(() => {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text + ' ' + link).then(() => { ui.lobbyNote = t('linkCopied'); render(); }, () => { ui.lobbyNote = link; render(); });
    return;
  }
  ui.lobbyNote = link; render();
}

function lobbyHTML() {
